<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison Aurelle share card artwork</title>
  <style>
    @font-face{font-family:Cormorant;src:url('../dist/assets/cormorant-regular.ttf')}
    @font-face{font-family:Cormorant;src:url('../dist/assets/cormorant-italic.ttf');font-style:italic}
    @font-face{font-family:Manrope;src:url('../dist/assets/manrope-regular.ttf')}
    *{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#302c28}
    main{width:1200px;height:630px;display:grid;grid-template-columns:550px 650px;overflow:hidden}
    .copy{padding:50px 44px 40px 54px;display:flex;flex-direction:column;align-items:flex-start;background:radial-gradient(ellipse at bottom left,#ece2d1,transparent 80%)}
    .brand{font:36px Cormorant;letter-spacing:5px;color:#502734;margin:0}
    .brand small{display:block;font:11px Manrope;letter-spacing:5px;margin-bottom:7px}
    .line{width:40px;height:1px;background:#a58d79;margin-top:30px}
    h1{font:76px/.99 Cormorant;letter-spacing:-2px;font-weight:400;margin:28px 0 23px}
    h1 em{color:#502734;white-space:nowrap}
    p{font:18px/1.7 Manrope;color:#6c625a;margin:0;max-width:355px}
    .foot{margin-top:auto;font:11px Manrope;letter-spacing:2px;color:#502734}
    img{width:650px;height:630px;object-fit:cover;object-position:55% center}
  </style>
</head>
<body><main><section class="copy"><div class="brand"><small>MAISON</small>AURELLE</div><div class="line"></div><h1>Some gifts<br>say <em>everything.</em></h1><p>Thoughtful gifts.<br>Beautiful everyday luxuries.</p><div class="foot">THE ART OF GIVING / BOUTIQUE CONCEPT</div></section><img src="../dist/assets/gift-atelier.jpg" alt="Ivory gift boxes with burgundy ribbons"></main></body>
</html>
